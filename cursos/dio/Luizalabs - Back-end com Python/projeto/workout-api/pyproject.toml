[project]
name = "workout-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alan oliveira", email = "alanliveira@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = "src"

[tool.fastapi]
entrypoint = "api.configs:app"
